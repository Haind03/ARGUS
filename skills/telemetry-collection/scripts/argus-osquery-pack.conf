{
  "platform": "windows,darwin,linux",
  "version": "1.0.0",
  "queries": {
    "argus_processes": {"query": "SELECT p.pid, p.parent AS ppid, p.name, p.path, p.cmdline, h.sha256 FROM processes p LEFT JOIN hash h ON h.path = p.path;", "interval": 3600, "snapshot": true},
    "argus_startup_items": {"query": "SELECT * FROM startup_items;", "interval": 3600, "snapshot": true},
    "argus_scheduled_tasks": {"query": "SELECT name, path, action, enabled, hidden FROM scheduled_tasks;", "interval": 3600, "snapshot": true, "platform": "windows"},
    "argus_services": {"query": "SELECT name, display_name, path, start_type, status, user_account FROM services;", "interval": 3600, "snapshot": true, "platform": "windows"},
    "argus_drivers": {"query": "SELECT description, image, signed, service FROM drivers;", "interval": 3600, "snapshot": true, "platform": "windows"},
    "argus_wmi_cli": {"query": "SELECT name, command_line_template FROM wmi_cli_event_consumers;", "interval": 3600, "snapshot": true, "platform": "windows"},
    "argus_wmi_script": {"query": "SELECT name, script_text FROM wmi_script_event_consumers;", "interval": 3600, "snapshot": true, "platform": "windows"},
    "argus_sockets": {"query": "SELECT pid, protocol, local_address, local_port, remote_address, remote_port, state FROM process_open_sockets;", "interval": 900, "snapshot": true},
    "argus_chrome_ext": {"query": "SELECT browser_type, identifier, name, version, permissions, from_webstore FROM chrome_extensions;", "interval": 86400, "snapshot": true},
    "argus_crontab": {"query": "SELECT * FROM crontab;", "interval": 3600, "snapshot": true, "platform": "darwin,linux"},
    "argus_launchd": {"query": "SELECT label, program, program_arguments, run_at_load FROM launchd WHERE run_at_load = 1;", "interval": 3600, "snapshot": true, "platform": "darwin"},
    "argus_systemd": {"query": "SELECT id, fragment_path, active_state FROM systemd_units WHERE active_state = 'active';", "interval": 3600, "snapshot": true, "platform": "linux"}
  }
}
