title: Office Application Spawns Script Host or LOLBin
id: 3c851470-6d86-5a5b-a5bb-07b528dbe816
status: experimental
description: ARGUS starter rule (defensive). Office Application Spawns Script Host or LOLBin. Maps to MITRE ATT&CK T1566.001.
author: ARGUS
date: 2026-11-23
tags:
    - attack.initial_access
    - attack.t1566.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\\winword.exe'
            - '\\excel.exe'
            - '\\powerpnt.exe'
            - '\\outlook.exe'
            - '\\onenote.exe'
    selection_child:
        Image|endswith:
            - '\\powershell.exe'
            - '\\pwsh.exe'
            - '\\cmd.exe'
            - '\\wscript.exe'
            - '\\cscript.exe'
            - '\\mshta.exe'
            - '\\rundll32.exe'
            - '\\regsvr32.exe'
            - '\\certutil.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Office add-ins launching helpers; macro-enabled corporate templates
level: high
