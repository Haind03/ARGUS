title: LSASS Dump via comsvcs MiniDump
id: d52492bb-9ff8-50d4-8c6c-154807cb25ae
status: experimental
description: ARGUS starter rule (defensive). LSASS Dump via comsvcs MiniDump. Maps to MITRE ATT&CK T1003.001.
author: ARGUS
date: 2026-11-23
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs'
            - 'minidump'
    condition: selection
falsepositives:
    - None known
level: critical
