title: Shadow Copy Deletion or Recovery Disabled
id: 2ab06177-2268-5db0-bf81-7ef615902d5c
status: experimental
description: ARGUS starter rule (defensive). Shadow Copy Deletion or Recovery Disabled. Maps to MITRE ATT&CK T1490.
author: ARGUS
date: 2026-11-23
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_vss:
        Image|endswith: '\\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    selection_bcd:
        Image|endswith: '\\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled'
            - 'bootstatuspolicy'
    selection_wb:
        Image|endswith: '\\wbadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'catalog'
    condition: 1 of selection_*
falsepositives:
    - Backup software maintenance (rare on personal PCs)
level: critical
