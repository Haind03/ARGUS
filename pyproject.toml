[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-defense"
version = "0.1.1"
description = "ARGUS: detect-only threat hunting for your own Windows PC (MITRE ATT&CK). by HaiND from the Post and Telecommunication Institute of Technology"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HaiND", email = "haind03@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["threat-hunting", "dfir", "mitre-attack", "malware-detection", "yara", "blue-team"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
memory = ["volatility3>=2.5"]
dev = ["pytest>=7", "PyYAML>=6"]
full = ["yara-python>=4.3", "volatility3>=2.5", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/Haind03/argus"
Issues = "https://github.com/Haind03/argus/issues"

[project.scripts]
argus = "argus_cli:run"

[tool.setuptools]
package-dir = { "" = "engine" }
py-modules = ["argus_cli"]
packages = ["argus"]
include-package-data = true

[tool.setuptools.package-data]
argus = ["_data/**/*"]
