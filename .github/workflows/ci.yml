# Continuous tests on every push / pull request. by HaiND from the Post and Telecommunication Institute of Technology
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyyaml yara-python
      - run: python -m pytest
      - name: PowerShell syntax check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: YARA bundle integrity
        run: python -I -c "import sys; sys.path.insert(0,'engine'); from pathlib import Path; from argus import yara_bundle as y; r,n=y.compile_all(Path('.')); print(n,'rule files compiled'); sys.exit(0 if r else 1)"
