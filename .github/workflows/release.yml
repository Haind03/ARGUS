# Build, test and publish an ARGUS release when a tag v* is pushed.
# by HaiND from the Post and Telecommunication Institute of Technology
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml yara-python
      - run: python -m pytest
      - name: PowerShell syntax check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; Write-Host "::error file=$($_.FullName)::$($e[0].Message)" }
          }
          if ($bad) { exit 1 }

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -I tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes
        run: |
          awk '/^## v/{n++} n==1' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "ARGUS by HaiND from the Post and Telecommunication Institute of Technology" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ARGUS ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/<owner>/argus
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/argus
          V=${GITHUB_REF_NAME#v}
          docker build -t $IMG:$V -t $IMG:latest .
          docker push $IMG:$V
          docker push $IMG:latest
